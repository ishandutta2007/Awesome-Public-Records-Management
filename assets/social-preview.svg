<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 0.8; transform: scale(1.05); }
        100% { opacity: 0.3; transform: scale(0.95); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }
      @keyframes dash {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .pulsing-glow {
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-icon {
        animation: float 4s ease-in-out infinite;
      }
      .dashed-line {
        stroke-dasharray: 6, 6;
        animation: dash 15s linear infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #38bdf8;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Outer Canvas Fill (Top/Bottom 50px Padding Area: #090d16) -->
  <rect width="640" height="320" fill="#090d16"/>

  <!-- Inner Banner Container (y=50, height=220) -->
  <g transform="translate(0, 50)">
    <!-- Clip Path for Banner Content -->
    <clipPath id="bannerClip">
      <rect width="640" height="220"/>
    </clipPath>

    <g clip-path="url(#bannerClip)">
      <!-- Banner Background Fill -->
      <rect width="640" height="220" fill="url(#bg)"/>
      
      <!-- Subtle Grid Pattern -->
      <g opacity="0.06" stroke="#ffffff" stroke-width="1">
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
          <path d="M 30 0 L 0 0 0 30"/>
        </pattern>
        <rect width="640" height="220" fill="url(#grid)"/>
      </g>

      <!-- Glowing Orbs -->
      <circle cx="80" cy="110" r="100" fill="url(#glow)" class="pulsing-glow"/>
      <circle cx="560" cy="50" r="80" fill="url(#glow)" class="pulsing-glow" style="animation-delay: -2s;"/>

      <!-- Banner Top & Bottom Accent Lines -->
      <rect x="0" y="0" width="640" height="2" fill="url(#accent)"/>
      <rect x="0" y="218" width="640" height="2" fill="url(#accent)"/>

      <!-- Left Side Graphic: Floating Shield & Document Badge -->
      <g transform="translate(70, 110)" class="floating-icon">
        <!-- Shield Outline -->
        <path d="M 0 -45 L 32 -26 L 32 12 Q 0 45 -32 12 L -32 -26 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
        
        <!-- Document Card inside Shield -->
        <rect x="-14" y="-20" width="28" height="36" rx="3" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
        <line x1="-8" y1="-12" x2="8" y2="-12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
        <line x1="-8" y1="-5" x2="4" y2="-5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
        <line x1="-8" y1="2" x2="8" y2="2" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
        <line x1="-8" y1="9" x2="2" y2="9" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>

        <!-- Green Checkmark Circle Badge -->
        <circle cx="12" cy="12" r="10" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
        <path d="M 8 12 L 11 15 L 17 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Main Text Content -->
      <g transform="translate(130, 0)">
        <!-- Pill Badge -->
        <rect x="0" y="32" width="225" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="12" y="48" class="badge-text">GOVERNMENT TECH &amp; FOIA SUITE</text>

        <!-- Main Title -->
        <text x="0" y="90" class="title-text" font-size="22">Awesome Public Records Management</text>
        
        <!-- Gradient Accent Bar -->
        <rect x="0" y="102" width="460" height="3.5" rx="1.75" fill="url(#accent)"/>

        <!-- Subtitle Text -->
        <text x="0" y="128" class="subtitle-text" font-size="12.5">Curated Ecosystem of FOIA Portals, Enterprise EDMS &amp; Archival Systems</text>
        <text x="0" y="146" class="subtitle-text" font-size="12.5">Comprehensive SaaS &amp; Open-Source Guide for Government Entities</text>
      </g>

      <!-- Right Side Network Graphic -->
      <g transform="translate(560, 110)">
        <line x1="-30" y1="-35" x2="25" y2="-45" stroke="#38bdf8" stroke-width="1.5" class="dashed-line"/>
        <line x1="-30" y1="-35" x2="15" y2="35" stroke="#818cf8" stroke-width="1.5" class="dashed-line"/>
        <line x1="25" y1="-45" x2="40" y2="5" stroke="#c084fc" stroke-width="1.5" class="dashed-line"/>
        <line x1="15" y1="35" x2="40" y2="5" stroke="#38bdf8" stroke-width="1.5" class="dashed-line"/>

        <circle cx="-30" cy="-35" r="5" fill="#38bdf8"/>
        <circle cx="25" cy="-45" r="6" fill="#818cf8"/>
        <circle cx="15" cy="35" r="5" fill="#c084fc"/>
        <circle cx="40" cy="5" r="6" fill="#38bdf8"/>
      </g>
    </g>
  </g>
</svg>
